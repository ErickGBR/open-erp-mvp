services:
  # ─── Single service: Backend + Frontend ────────────────────────
  - type: web
    name: open-erp-mvp
    runtime: docker
    plan: free
    region: oregon
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRATION
        value: 1d
      - key: DISABLE_LANDING
        value: "true"
